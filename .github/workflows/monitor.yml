name: monitor

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      CHECK_INTERVAL_SECONDS: "15"
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: check-updates
        shell: bash
        run: |
          set -u
          curl -s -o monitor_check.py -H "Authorization: token $PRIVATE_REPO_TOKEN" \
            "https://raw.githubusercontent.com/SENyiAi/Udon/main/monitor_check.py"
          python3 monitor_check.py 2>&1 | tee /tmp/monitor.log
