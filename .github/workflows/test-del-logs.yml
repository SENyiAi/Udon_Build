name: test-del-logs
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: echo "Sensitive log line: my_secret_data_12345"
      - name: delete-logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          echo "Trying to delete logs..."
          res=$(curl -s -w "%{http_code}" -o /dev/null -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/logs")
          echo "HTTP code from delete logs: $res"
